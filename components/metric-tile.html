<!-- Metric tile / Stat
     Purpose: big-number highlights (KPIs).
     Parts: __value, __label, optional __delta (--up / --down).
     A11y: value + label read together; the delta has a text equivalent. -->

<div class="slate-metrics">

  <div class="slate-metric">
    <p class="slate-metric__value">1,800</p>
    <p class="slate-metric__label">Miles from the Shire to the fire</p>
  </div>

  <div class="slate-metric">
    <p class="slate-metric__value">+12%</p>
    <p class="slate-metric__label">Pace since Rivendell</p>
    <p class="slate-metric__delta slate-metric__delta--up">Up from last week</p>
  </div>

  <div class="slate-metric">
    <p class="slate-metric__value">4.6</p>
    <p class="slate-metric__label">Rating of the inn at Bree</p>
  </div>

</div>
